{% extends 'base.html' %}

{% block content %}

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        color: #1f2937;
    }

    .chat-container {
        width: 100%;
        height: 80vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .chat-header {
        height: 64px;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        padding: 0 24px;
        flex-shrink: 0;
    }

    .chat-header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 30px 20px;
        scroll-behavior: smooth;
    }

    .messages-wrapper {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
    }

    .message {
        display: flex;
        margin-bottom: 24px;
    }

    .message.user {
        justify-content: flex-end;
    }

    .message.ai {
        justify-content: flex-start;
    }

    .message-content {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 14px;
        line-height: 1.5;
        font-size: 15px;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .message.user .message-content {
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 4px;
    }

    .message.ai .message-content {
        background: white;
        border: 1px solid #e5e7eb;
        color: #1f2937;
        border-bottom-left-radius: 4px;
    }

    .attached-file {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        padding: 9px 12px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        font-size: 13px;
    }

    .attached-file-icon {
        font-size: 20px;
    }

    .chat-input-area {
        width: 100%;
        padding: 14px 20px 20px;
        background: #f5f7fa;
        flex-shrink: 0;
    }

    .input-wrapper {
        max-width: 900px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 16px;
        padding: 10px 12px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    #messageInput {
        flex: 1;
        border: none;
        outline: none;
        resize: none;
        font-family: inherit;
        font-size: 15px;
        line-height: 1.5;
        padding: 7px 4px;
        min-height: 24px;
        max-height: 112px;
        overflow-y: auto;
        background: transparent;
    }

    #messageInput::placeholder {
        color: #9ca3af;
    }

    .input-button {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 10px;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 19px;
        transition: background 0.2s;
        flex-shrink: 0;
    }

    .input-button:hover {
        background: #f3f4f6;
    }

    .send-button {
        background: #2563eb;
        color: white;
    }

    .send-button:hover {
        background: #1d4ed8;
    }

    .send-button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
    }

    .selected-file {
        max-width: 900px;
        margin: 0 auto 8px;
        display: none;
        align-items: center;
        justify-content: space-between;
        background: white;
        border: 1px solid #e5e7eb;
        padding: 9px 12px;
        border-radius: 10px;
        font-size: 13px;
    }

    .selected-file.show {
        display: flex;
    }

    .file-info {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .remove-file {
        border: none;
        background: transparent;
        cursor: pointer;
        color: #6b7280;
        font-size: 18px;
    }

    .remove-file:hover {
        color: #dc2626;
    }

    .chat-messages.dragging {
        background: rgba(37, 99, 235, 0.05);
        outline: 2px dashed #2563eb;
        outline-offset: -10px;
    }

    .typing {
        display: inline-flex;
        gap: 4px;
        padding: 4px 0;
    }

    .typing span {
        width: 6px;
        height: 6px;
        background: #9ca3af;
        border-radius: 50%;
        animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0%, 60%, 100% {
            transform: translateY(0);
        }

        30% {
            transform: translateY(-4px);
        }
    }

    @media (max-width: 700px) {

        .chat-header {
            padding: 0 15px;
        }

        .chat-messages {
            padding: 20px 12px;
        }

        .chat-input-area {
            padding: 10px 12px 14px;
        }

        .message-content {
            max-width: 88%;
        }
    }
</style>

</div>

<script>

    console.log("=================================");
    console.log("ASISTENTE IA - SCRIPT CARGADO");
    console.log("=================================");


    /* ==============================
       ELEMENTOS
    ============================== */

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const attachButton =
        document.getElementById("attachButton");

    const fileInput =
        document.getElementById("fileInput");

    const selectedFile =
        document.getElementById("selectedFile");

    const selectedFileName =
        document.getElementById("selectedFileName");

    const removeFile =
        document.getElementById("removeFile");

    const chatMessages =
        document.getElementById("chatMessages");

    const messagesWrapper =
        document.getElementById("messagesWrapper");


    console.log("Elementos encontrados:", {
        messageInput: !!messageInput,
        sendButton: !!sendButton,
        attachButton: !!attachButton,
        fileInput: !!fileInput,
        selectedFile: !!selectedFile,
        chatMessages: !!chatMessages
    });


    let currentFile = null;


    /* ==============================
       HISTORIAL
    ============================== */

    let chatHistory = [];

    try {

        chatHistory =
            JSON.parse(
                localStorage.getItem("chatHistory")
            ) || [];

    } catch (error) {

        console.error(
            "Error leyendo historial:",
            error
        );

        chatHistory = [];
    }


    function loadHistory() {

        messagesWrapper.innerHTML = "";

        chatHistory.forEach(message => {

            createMessage(
                message.role,
                message.text,
                message.fileName || null
            );

        });

        scrollToBottom();
    }


    function saveMessage(
        role,
        text,
        fileName = null
    ) {

        chatHistory.push({

            role: role,

            text: text,

            fileName: fileName,

            date: new Date().toISOString()

        });


        localStorage.setItem(
            "chatHistory",
            JSON.stringify(chatHistory)
        );
    }


    /* ==============================
       CREAR MENSAJE
    ============================== */

    function createMessage(
        role,
        text,
        fileName = null
    ) {

        const message =
            document.createElement("div");

        message.classList.add(
            "message",
            role
        );


        const content =
            document.createElement("div");

        content.classList.add(
            "message-content"
        );


        content.textContent = text;


        if (fileName) {

            const fileElement =
                document.createElement("div");

            fileElement.classList.add(
                "attached-file"
            );


            const icon =
                document.createElement("span");

            icon.classList.add(
                "attached-file-icon"
            );

            icon.textContent = "📄";


            const name =
                document.createElement("span");

            name.textContent = fileName;


            fileElement.appendChild(icon);

            fileElement.appendChild(name);

            content.appendChild(fileElement);
        }


        message.appendChild(content);

        messagesWrapper.appendChild(message);
    }


    /* ==============================
       SCROLL
    ============================== */

    function scrollToBottom() {

        setTimeout(() => {

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }, 50);
    }


    /* ==============================
       TEXTAREA
    ============================== */

    function resizeTextarea() {

        messageInput.style.height = "auto";


        const maxHeight = 112;


        const newHeight =
            Math.min(
                messageInput.scrollHeight,
                maxHeight
            );


        messageInput.style.height =
            newHeight + "px";


        messageInput.style.overflowY =
            messageInput.scrollHeight > maxHeight
                ? "auto"
                : "hidden";
    }


    messageInput.addEventListener(
        "input",
        resizeTextarea
    );


    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }

        }
    );


    /* ==============================
       ARCHIVO
    ============================== */

    attachButton.addEventListener(
        "click",
        function() {

            console.log(
                "Botón de adjuntar presionado"
            );

            fileInput.click();

        }
    );


    fileInput.addEventListener(
        "change",
        function() {

            if (this.files.length === 0) {
                return;
            }


            handleFile(
                this.files[0]
            );

        }
    );


    function handleFile(file) {

        console.log(
            "Archivo seleccionado:",
            file.name
        );


        if (
            file.type !== "application/pdf" &&
            !file.name
                .toLowerCase()
                .endsWith(".pdf")
        ) {

            alert(
                "Solo se permiten documentos PDF."
            );

            return;
        }


        currentFile = file;


        selectedFileName.textContent =
            file.name;


        selectedFile.classList.add(
            "show"
        );
    }


    removeFile.addEventListener(
        "click",
        function() {

            console.log(
                "Archivo eliminado"
            );


            currentFile = null;

            fileInput.value = "";

            selectedFile.classList.remove(
                "show"
            );

        }
    );


    /* ==============================
       DRAG & DROP
    ============================== */

    chatMessages.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();

            chatMessages.classList.add(
                "dragging"
            );

        }
    );


    chatMessages.addEventListener(
        "dragleave",
        function(event) {

            event.preventDefault();

            chatMessages.classList.remove(
                "dragging"
            );

        }
    );


    chatMessages.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

            chatMessages.classList.remove(
                "dragging"
            );


            const files =
                event.dataTransfer.files;


            if (files.length === 0) {
                return;
            }


            handleFile(
                files[0]
            );

        }
    );


    /* ==============================
       BOTÓN ENVIAR
    ============================== */

    sendButton.addEventListener(
        "click",
        function() {

            console.log(
                "BOTÓN ENVIAR PRESIONADO"
            );

            sendMessage();

        }
    );


    /* ==============================
       ENVIAR MENSAJE
    ============================== */

    async function sendMessage() {

        console.log(
            "SEND MESSAGE EJECUTADO"
        );


        const text =
            messageInput.value.trim();


        console.log(
            "Mensaje:",
            text
        );


        console.log(
            "Archivo:",
            currentFile
        );


        if (!text && !currentFile) {

            console.log(
                "No hay mensaje ni archivo."
            );

            return;
        }


        const fileName =
            currentFile
                ? currentFile.name
                : null;


        /* ------------------------------
           Mostrar mensaje del usuario
        ------------------------------ */

        createMessage(
            "user",
            text || "Analizar documento",
            fileName
        );


        saveMessage(
            "user",
            text || "Analizar documento",
            fileName
        );


        messageInput.value = "";

        resizeTextarea();

        scrollToBottom();


        /* ------------------------------
           Indicador de escritura
        ------------------------------ */

        const typingMessage =
            document.createElement("div");


        typingMessage.classList.add(
            "message",
            "ai"
        );


        typingMessage.innerHTML = `
            <div class="message-content">
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        `;


        messagesWrapper.appendChild(
            typingMessage
        );


        scrollToBottom();


        /* ------------------------------
           FormData
        ------------------------------ */

        const formData =
            new FormData();


        formData.append(
            "message",
            text
        );


        if (currentFile) {

            formData.append(
                "file",
                currentFile
            );
        }


        console.log(
            "FormData preparado."
        );


        console.log(
            "Enviando POST a /api/chat..."
        );


        /* ------------------------------
           FETCH
        ------------------------------ */

        try {
            const inicioTotal = performance.now();

            const response =
                
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            console.log(
                "Respuesta recibida."
            );

            const finTotal = performance.now();

            const tiempoTotal =
                (finTotal - inicioTotal) / 1000;

            console.log(
                "HTTP Status:",
                response.status
            );


            console.log(
                "Content-Type:",
                response.headers.get(
                    "content-type"
                )
            );


            /*
             * Primero obtenemos texto.
             *
             * No usamos directamente
             * response.json(), porque si
             * Flask devuelve HTML aparecerá:
             *
             * Unexpected token '<'
             */

            const responseText =
                await response.text();


            console.log(
                "Respuesta del servidor:"
            );

            console.log(
                responseText
            );


            let data;


            /* ------------------------------
               Convertir respuesta a JSON
            ------------------------------ */

            try {

                data =
                    JSON.parse(
                        responseText
                    );

            } catch (jsonError) {

                console.error(
                    "LA RESPUESTA DE FLASK NO ES JSON"
                );


                console.error(
                    "Respuesta recibida:",
                    responseText
                );


                typingMessage.remove();


                createMessage(
                    "ai",
                    "El servidor devolvió una respuesta no válida. Revise la consola de Flask."
                );


                scrollToBottom();


                return;
            }


            /* ------------------------------
               Error HTTP
            ------------------------------ */

            if (!response.ok) {

                console.error(
                    "Error HTTP:",
                    response.status
                );


                console.error(
                    "Detalle:",
                    data
                );


                typingMessage.remove();


                createMessage(
                    "ai",
                    "Error del servidor: " +
                    (
                        data.error ||
                        "Error HTTP " +
                        response.status
                    )
                );


                scrollToBottom();


                return;
            }


            /* ------------------------------
               Error lógico
            ------------------------------ */

            if (!data.success) {

                console.error(
                    "La API devolvió success=false:",
                    data
                );


                typingMessage.remove();


                createMessage(
                    "ai",
                    "Error: " +
                    (
                        data.error ||
                        "No fue posible obtener una respuesta."
                    )
                );


                scrollToBottom();


                return;
            }


            /* ------------------------------
               RESPUESTA DE LA IA
            ------------------------------ */

            typingMessage.remove();


            createMessage(
                "ai",
                data.response
            );


            saveMessage(
                "ai",
                data.response
            );


            console.log(
                "Respuesta IA:",
                data.response
            );


            console.log(
                "Modelo utilizado:",
                data.model
            );


            console.log(
                "Tipo de documento:",
                data.document_type
            );


            console.log(
                "Información PDF:",
                data.document_info
            );


            scrollToBottom();


        } catch (error) {

            console.error(
                "ERROR EN FETCH:"
            );


            console.error(
                error
            );


            typingMessage.remove();


            createMessage(
                "ai",
                "No fue posible comunicarse con el servidor."
            );


            scrollToBottom();

        }


        /* ------------------------------
           Limpiar archivo
        ------------------------------ */

        currentFile = null;

        fileInput.value = "";

        selectedFile.classList.remove(
            "show"
        );

    }


    /* ==============================
       INICIALIZACIÓN
    ============================== */

    loadHistory();

    resizeTextarea();


    console.log(
        "ASISTENTE IA INICIALIZADO CORRECTAMENTE"
    );

</script>

{% endblock %}
