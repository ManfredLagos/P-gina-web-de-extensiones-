{% extends 'base2.html' %}

{% block content %}
<div class="form-container" style="display: flex; flex-direction: column;">
    <form method="POST" action="/Registrar_Usuario">
        <div class="formulario_registro">
            <h1>Confirmar Registro</h1>
            <div class="password-container" style="width: 470px; margin-bottom: 15px;">
                <label for="code" style="margin-right: 5px;">Ingrese el código de verificación:</label>
                <input type="text" id="confirm_code" name="confirm_code" placeholder="Ingrese el código" required>
            </div>
            <div class="form-group">
                <button type="submit">Registrar Usuario</button>
            </div>
            <input type="hidden" name="pin" value="{{ pin }}">
        </div>
    </form>

    <form method="POST" class="form-group" style="background: transparent; box-shadow: none; width: auto;">
        <input type="hidden" name="email" value="{{ email }}">
        <input type="hidden" name="pin" value="{{ pin }}">
        <button type="submit" name="resend_pin" id="resend-code-button" class="countdown-button" disabled>Volver a enviar código (15)</button>
    </form>
</div>

<!-- Modal de errores -->
<div class="modal_contenedor" id="mensaje_registro" style="display: none;">
    <div class="modal_informacion" id="mensaje_error">
        <img class="img_error"
             src="{{ url_for('static', filename='imagenes/error.png') }}"
             alt="Imagen de error">

        <div class="modal_texto">
            <p id="texto_error" style="padding: 0; margin: 0;"></p>
        </div>

        <button type="button" class="btn_modal" onclick="cerrarMensajeRegistro()">Volver</button>
    </div>
</div>

<!-- Modal de confirmación -->
<div class="modal_contenedor" id="confirmacion_registro" style="display: none;">
    <div class="modal_informacion" id="mensaje_confirmacion">
        <p>¡Registro completado correctamente!</p>
    </div>
</div>

<div id="shadow_inicio" class="sombra" style="display: none;"></div>

<script>
    let countdown = 15;
    let countdownInterval;

    function startCountdown() {
        const resendCodeButton = document.getElementById('resend-code-button');
        resendCodeButton.classList.add('countdown-button');

        countdownInterval = setInterval(() => {
            countdown--;

            if (countdown === 0) {
                clearInterval(countdownInterval);
                resendCodeButton.removeAttribute('disabled');
                resendCodeButton.classList.remove('countdown-button');
                resendCodeButton.innerText = 'Volver a enviar código';
            } else {
                resendCodeButton.innerText = `Volver a enviar código (${countdown})`;
            }
        }, 1000);
    }

    window.onload = startCountdown;

    const resendCodeButton = document.getElementById('resend-code-button');
    resendCodeButton.addEventListener('click', () => {
        countdown = 15;
        startCountdown();
    });


    

    document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('form_registro');
    const email = document.getElementById('email');
    const pin = document.getElementById('pin');
    const confirmPin = document.getElementById('confirm_pin');

    const modal = document.getElementById('mensaje_registro');
    const texto = document.getElementById('texto_error');
    const sombra = document.getElementById('shadow_inicio');
    const confirmacion = document.getElementById('confirmacion_registro');
    const boton = document.getElementById('btn_registrar');

    function mostrarErrorRegistro(tipo) {
        const mensajes = {
            correo: 'El correo debe pertenecer al dominio @callmyway.net.',
            pin: 'El PIN debe contener exactamente 6 dígitos numéricos.',
            pin_de_confirmacion: 'El PIN ingresado no coincide con el PIN de confirmación.',
            general: 'No fue posible completar el registro. Inténtelo nuevamente.'
        };

        texto.textContent = mensajes[tipo] || mensajes.general;
        modal.style.display = 'flex';
        sombra.style.display = 'block';
    }

    window.cerrarMensajeRegistro = function () {
        modal.style.display = 'none';
        sombra.style.display = 'none';
    };

    // Permitir únicamente números y un máximo de 6 dígitos
    [pin, confirmPin].forEach(campo => {
        campo.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });
    });

    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        cerrarMensajeRegistro();

        const correo = email.value.trim();
        const pinIngresado = pin.value;
        const confirmacionIngresada = confirmPin.value;

        // 1. Validar dominio del correo
        const patronCorreo = /^[^\s@]+@callmyway\.net$/i;

        if (!patronCorreo.test(correo)) {
            mostrarErrorRegistro('correo');
            return;
        }

        // 2. Validar el PIN
        if (!/^\d{6}$/.test(pinIngresado)) {
            mostrarErrorRegistro('pin');
            return;
        }

        // 3. Validar la confirmación
        if (!/^\d{6}$/.test(confirmacionIngresada) ||
            pinIngresado !== confirmacionIngresada) {
            mostrarErrorRegistro('pin_de_confirmacion');
            return;
        }

        boton.disabled = true;

        try {
            const respuesta = await fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            const data = await respuesta.json();

            if (!respuesta.ok || !data.success) {
                mostrarErrorRegistro(data.error || 'general');
                boton.disabled = false;
                return;
            }

            // Mostrar éxito únicamente después de confirmar el registro
            modal.style.display = 'none';
            confirmacion.style.display = 'flex';
            sombra.style.display = 'block';

            setTimeout(function () {
                window.location.href = '/';
            }, 2000);

        } catch (error) {
            console.error('Error al registrar usuario:', error);
            mostrarErrorRegistro('general');
            boton.disabled = false;
        }
    });
});
</script>
{% endblock %}
