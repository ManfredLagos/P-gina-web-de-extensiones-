
{% extends 'base.html' %}

{% block content %}

<div class="contenedor_contraseñas">
    <h1>Generador de Contraseñas</h1>

    <div class="container">
        <div class="row">
            <div class="box">
                <label>Longitud: <span class="value" id="lengthValue">12</span></label>
                <input type="range" id="length" min="4" max="32" value="12">
            </div>

            <div class="box">
                <label>Cantidad: <span class="value" id="quantityValue">1</span></label>
                <input type="range" id="quantity" min="1" max="10" value="1">
            </div>
        </div>

        <div class="options">
            <div class="toggle">
                <span>Mayúsculas</span>
                <label class="switch">
                    <input type="checkbox" id="upper" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle">
                <span>Minúsculas</span>
                <label class="switch">
                    <input type="checkbox" id="lower" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle">
                <span>Números</span>
                <label class="switch">
                    <input type="checkbox" id="numbers" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle">
                <span>Caracteres especiales</span>
                <label class="switch">
                    <input type="checkbox" id="symbols" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="strength">
            <div id="strengthBar"></div>
        </div>
        <span id="strengthText">Seguridad</span>

        <div class="generar_contrasena">
            <button onclick="generatePassword()">Generar</button>
        </div>

        <div class="result"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='funciones/contraseñas.js') }}"></script>

{% endblock %}
