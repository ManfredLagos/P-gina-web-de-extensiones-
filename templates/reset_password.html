{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2 style="color: rgb(10, 10, 10);">Restablecer contraseña</h2>
    <form method="POST">
        <div class="form-group">
            <input type="text" id="code" name="code" placeholder="Ingrese el código de verificación" required>
        </div>
        <div class="password-container">
            <input type="password" id="new_pin" name="new_pin" placeholder="Ingrese el nuevo pin" required>
            <span class="password-toggle" onclick="togglePasswordVisibility2()">
                <i class="fa fa-eye"></i>
            </span>
        </div>
        <div class="password-container">
            <input type="password" id="confirm_pin" name="confirm_pin" placeholder="Confirme el nuevo pin" required>
            <span class="password-toggle" onclick="togglePasswordVisibility3()">
                <i class="fa fa-eye"></i>
            </span>
        </div>
        {% if error_message %}
            <p style="color: red;">{{ error_message }}</p>
        {% endif %}
        <button type="submit">Restablecer contraseña</button>
        <input type="hidden" name="pin" value="{{ pin }}">
    </form>

    <form method="POST" style="margin-top: 10px;">
        <input type="hidden" name="email" value="{{ email }}">
        <input type="hidden" name="pin" value="{{ pin }}">
        <button type="submit" name="resend_pin" id="resend-code-button" class="countdown-button" disabled>Volver a enviar código (15)</button>
    </form>
</div>

<script>
    let countdown = 15;
    let countdownInterval;

    function startCountdown() {
        const resendCodeButton = document.getElementById('resend-code-button');
        resendCodeButton.classList.add('countdown-button');

        countdownInterval = setInterval(() => {
            countdown--;

            if (countdown === 0) {
                clearInterval(countdownInterval);
                resendCodeButton.removeAttribute('disabled');
                resendCodeButton.classList.remove('countdown-button');
                resendCodeButton.innerText = 'Volver a enviar código';
            } else {
                resendCodeButton.innerText = `Volver a enviar código (${countdown})`;
            }
        }, 1000);
    }

    window.onload = startCountdown;

    const resendCodeButton = document.getElementById('resend-code-button');
    resendCodeButton.addEventListener('click', () => {
        countdown = 15;
        startCountdown();
    });
</script>
{% endblock %}
