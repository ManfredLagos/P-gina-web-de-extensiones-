
{% extends 'base.html' %}

{% block content %}
  
<h1 style="height: 100px;">Respuestas Rápidas</h1>
<!--<div class="form-container"></div>-->

<div id="board">
    <!-- Post-it: Crear nueva respuesta -->
    <div class="note note-create" style="background: #fef08a;">
        <form id="noteForm">
            <div class="note-header">
                <input type="text" id="title" placeholder="Título de la respuesta"required>
                    <div class="color-picker">
                        <div class="selected green"></div>
                        <div class="option option2 blue" data-color="blue"></div>
                        <div class="option option1 green" data-color="green"></div>
                    </div>
                <img style="width: 18px; height: 18px;" src="/static/imagenes/mas.png">
                <img style="display: none;" alt="Eliminar" onclick="eliminarNota(1)">
            </div>
            <textarea class="note-content" id="content" placeholder="Escriba aquí la respuesta rápida..."required></textarea>
            <div class="note-options">
                <div class="checkbox_cuerpo">
                    <span>Agregar cuerpo a la respuesta</span>
                    <label class="switch_cuerpo">
                        <input type="checkbox" id="respuesta_cuerpo" checked>
                        <span class="slider_cuerpo"></span>
                    </label>
                </div>
            </div>
        </form>
    </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="{{ url_for('static', filename='funciones/respuestas_rapidas.js') }}" ></script>
  <script>
  const ICON_DELETE = "{{ url_for('static', filename='imagenes/borrar.png') }}";
  const ICON_COPY   = "{{ url_for('static', filename='imagenes/archivo.png') }}";
</script>

<script>
    const picker = document.querySelector(".color-picker");
    const selected = document.querySelector(".selected");
    selected.onclick = () => {
        picker.classList.toggle("open");
    }
    document.querySelectorAll(".option").forEach(option => {
        option.onclick = () => {
            selected.className = "selected " + option.dataset.color;
            picker.classList.remove("open");
        }
    });
    document.addEventListener("click", e => {
        if (!picker.contains(e.target)) {
            picker.classList.remove("open");
        }
    });
</script>

{% endblock %}
