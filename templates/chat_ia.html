{% extends 'base.html' %}

{% block content %}

<div class="chat-container">

<header class="chat-header">
    <h1>Asistente Virtual</h1>
</header>

<main class="chat-messages" id="chatMessages">
    <div class="messages-wrapper" id="messagesWrapper"></div>
</main>

<section class="chat-input-area">

    <div class="selected-file" id="selectedFile">

        <div class="file-info">
            <span>📄</span>
            <span id="selectedFileName"></span>
        </div>

        <button type="button" class="remove-file" id="removeFile" title="Eliminar documento">
            ×
        </button>

    </div>

    <div class="input-wrapper">

        <button type="button" class="input-button" id="attachButton" title="Agregar documento PDF">
            📎
        </button>

        <input type="file" id="fileInput" accept=".pdf,application/pdf" hidden>

        <textarea id="messageInput" rows="1" placeholder="Escriba su consulta..."></textarea>

        <button type="button" class="input-button send-button" id="sendButton" title="Enviar">
            ➤
        </button>
    </div>
</section>

</div>
<script src="{{ url_for('static', filename='funciones/chat_ia.js') }}"></script>

{% endblock %}
