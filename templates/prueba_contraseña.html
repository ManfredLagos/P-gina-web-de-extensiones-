<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador de Contraseñas</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 20px;
    background: rgba(20, 20, 40, 0.85);
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 20px;
}

/* ROW */
.row {
    display: flex;
    gap: 20px;
}

.box {
    flex: 1;
}

/* RANGE */
input[type=range] {
    width: 100%;
    margin-top: 10px;
    accent-color: #8b5cf6;
}

.value {
    font-size: 14px;
    color: #cbd5f5;
}

/* TOGGLES */
.options {
    margin-top: 20px;
}

.toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e293b;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}

/* SWITCH */
.switch {
    position: relative;
    width: 45px;
    height: 24px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    cursor: pointer;
    background: #334155;
    border-radius: 20px;
    width: 100%;
    height: 100%;
    transition: 0.3s;
}

.slider::before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
}

.switch input:checked + .slider {
    background: #8b5cf6;
}

.switch input:checked + .slider::before {
    transform: translateX(21px);
}

/* STRENGTH */
.strength {
    height: 10px;
    background: #1e293b;
    border-radius: 10px;
    margin-top: 20px;
}

#strengthBar {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    transition: 0.4s;
}

#strengthText {
    font-size: 14px;
    margin-top: 5px;
    display: block;
}

/* BUTTON */
button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #7c3aed, #3b82f6);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(124,58,237,0.6);
}

/* RESULT */
.result {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.result input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #020617;
    color: white;
}

.icon-btn {
    width: 45px;
    border-radius: 10px;
    background: #1e293b;
}
</style>

</head>
<body>

<div class="container">
    <h1>Generador de Contraseñas</h1>
    <p class="subtitle">Crea contraseñas fuertes y seguras</p>

    <div class="row">
        <div class="box">
            <label>Longitud: <span class="value" id="lengthValue">12</span></label>
            <input type="range" id="length" min="4" max="32" value="12">
        </div>

        <div class="box">
            <label>Cantidad: <span class="value" id="quantityValue">1</span></label>
            <input type="range" id="quantity" min="1" max="10" value="1">
        </div>
    </div>

    <div class="options">
        <div class="toggle">
            <span>Mayúsculas</span>
            <label class="switch">
                <input type="checkbox" id="upper" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle">
            <span>Minúsculas</span>
            <label class="switch">
                <input type="checkbox" id="lower" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle">
            <span>Números</span>
            <label class="switch">
                <input type="checkbox" id="numbers" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle">
            <span>Caracteres especiales</span>
            <label class="switch">
                <input type="checkbox" id="symbols" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="strength">
        <div id="strengthBar"></div>
    </div>
    <span id="strengthText">Seguridad</span>

    <button onclick="generatePassword()">⚡ Generar contraseña</button>

    <div class="result">
        <input type="text" id="output" readonly>
        <button class="icon-btn" onclick="copy()">📋</button>
        <button class="icon-btn" onclick="generatePassword()">🔄</button>
    </div>
</div>

<script>

const lengthEl = document.getElementById("length");
const quantityEl = document.getElementById("quantity");

const upperEl = document.getElementById("upper");
const lowerEl = document.getElementById("lower");
const numbersEl = document.getElementById("numbers");
const symbolsEl = document.getElementById("symbols");

const outputEl = document.getElementById("output");
const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");

lengthEl.addEventListener("input", () => {
    document.getElementById("lengthValue").innerText = lengthEl.value;
    checkStrengthConfig();
});

quantityEl.addEventListener("input", () => {
    document.getElementById("quantityValue").innerText = quantityEl.value;
});

[upperEl, lowerEl, numbersEl, symbolsEl].forEach(el => {
    el.addEventListener("change", checkStrengthConfig);
});

function generatePassword() {
    const length = parseInt(lengthEl.value);
    const quantity = parseInt(quantityEl.value);

    const upper = upperEl.checked;
    const lower = lowerEl.checked;
    const numbers = numbersEl.checked;
    const symbols = symbolsEl.checked;

    let chars = "";

    if (upper) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if (lower) chars += "abcdefghijklmnopqrstuvwxyz";
    if (numbers) chars += "0123456789";
    if (symbols) chars += "!@#$%&_";

    if (chars.length === 0) {
        strengthText.innerText = "Seleccione al menos un tipo de carácter";
        strengthBar.style.width = "0%";
        return;
    }

    let results = [];

    for (let q = 0; q < quantity; q++) {
        let password = [];

        if (upper) password.push(randomChar("ABCDEFGHIJKLMNOPQRSTUVWXYZ"));
        if (lower) password.push(randomChar("abcdefghijklmnopqrstuvwxyz"));
        if (numbers) password.push(randomChar("0123456789"));
        if (symbols) password.push(randomChar("!@#$%^&*()_+"));

        // Completar el resto
        while (password.length < length) {
            password.push(randomChar(chars));
        }

        // Mezclar
        password = shuffleArray(password);

        results.push(password.join(""));
    }

    outputEl.value = results.join(" | ");
}


function checkStrengthConfig() {
    const length = parseInt(lengthEl.value);

    const upper = upperEl.checked;
    const lower = lowerEl.checked;
    const numbers = numbersEl.checked;
    const symbols = symbolsEl.checked;

    let charsetSize = 0;

    if (lower) charsetSize += 15;
    if (upper) charsetSize += 20;
    if (numbers) charsetSize += 10;
    if (symbols) charsetSize += 25;

    let bonus = 0;
    if (length >= 16) bonus = 30;
    else if (length >= 12) bonus = 25;
    else if (length >= 8) bonus = 20;
    else if (length >= 6) bonus = 15;

    charsetSize += bonus;

    if (charsetSize === 0) {
        updateUI(0);
        return;
    }

    let score = charsetSize;

    updateUI(score);
}

function updateUI(score) {
    console.log("Score:", score);

    if (score < 25) {
        strengthBar.style.width = "20%";
        strengthBar.style.background = "#dc2626"; // rojo fuerte
        strengthText.innerText = "Muy débil";
    } 
    else if (score < 50) {
        strengthBar.style.width = "35%";
        strengthBar.style.background = "#f97316"; // naranja
        strengthText.innerText = "Débil";
    } 
    else if (score < 65) {
        strengthBar.style.width = "50%";
        strengthBar.style.background = "#eab308"; // amarillo
        strengthText.innerText = "Media";
    } 
    else if (score < 80) {
        strengthBar.style.width = "70%";
        strengthBar.style.background = "#84cc16"; // verde lima
        strengthText.innerText = "Fuerte";
    } 
    else if (score < 96) {
        strengthBar.style.width = "90%";
        strengthBar.style.background = "#22c55e"; // verde
        strengthText.innerText = "Muy fuerte";
    }
    else {
        strengthBar.style.width = "100%";
        strengthBar.style.background = "#06b6d4"; // azul (nivel máximo)
        strengthText.innerText = "Super fuerte";
    }
}

function randomChar(str) {
    return str[Math.floor(Math.random() * str.length)];
}

function shuffleArray(array) {
    return array.sort(() => Math.random() - 0.5);
}

function copy() {
    outputEl.select();
    document.execCommand("copy");
}

checkStrengthConfig();
</script>

</body>
</html>
